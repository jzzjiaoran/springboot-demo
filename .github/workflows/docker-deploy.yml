name: Build & Deploy Docker to Aliyun

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: springboot-demo
  CONTAINER_NAME: springboot-app
  HOST_PORT: 8081
  CONTAINER_PORT: 8080

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/image.tar
          ls -lh /tmp/image.tar

      - name: Upload image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "/tmp/image.tar"
          target: "/tmp"
          strip_components: 1

      - name: Deploy to Aliyun server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== 开始部署 ==="
            mkdir -p /opt/app/demo /opt/app/logs

            echo "=== 停止并删除旧容器 ==="
            docker rm -f ${{ env.CONTAINER_NAME }} || true

            echo "=== 加载新镜像 ==="
            docker load -i /tmp/image.tar

            echo "=== 启动新容器 ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              --restart always \
              -v /opt/app/logs:/app/logs \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "=== 清理临时文件和旧镜像 ==="
            rm -f /tmp/image.tar
            docker image prune -f

            echo "=== 等待服务启动 ==="
            sleep 15

            echo "=== 健康检查 ==="
            curl -s http://localhost:${{ env.HOST_PORT }}/health || echo "健康检查失败"

            echo "=== 部署完成 ==="
            docker ps | grep ${{ env.CONTAINER_NAME }}
